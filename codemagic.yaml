# iOS → TestFlight for the single MERGED app (ios/app).
#
# The 5 old per-grade / GAT-PAT iOS apps were consolidated into one app with an
# in-app dataset picker (Apple flagged the 5 as spam — same look, same concept).
# Their workflows were removed from this file; retire their App Store listings once
# this merged app is approved.
#
# BEFORE THE FIRST BUILD (see C:\Users\maew0\Documents\codemagic-appstore-checklist.md):
#   App name "ศัพท์อังกฤษ ม.ต้น", Bundle ID com.simonjhuan.vocabdaily (already filled in below).
#   1. DONE — App ID com.simonjhuan.vocabdaily registered in Apple Developer Portal.
#   2. DONE — App Store Connect app record created, Apple ID 6807688657 (name "ศัพท์อังกฤษ ม.ต้น–GAT-PAT").
#   3. Apple Developer Portal → Profiles → + → App Store Connect → pick the App ID +
#      the Distribution cert that matches the Codemagic identity `distribution` →
#      Generate → Download the .mobileprovision.
#   4. Codemagic → Team settings → Code signing identities → iOS provisioning profiles →
#      Upload it → set its Reference name to `vocab_merged_appstore`.
#   5. Codemagic → Team settings → Integrations → Developer Portal: an App Store Connect
#      API key named `codemagic_api_key` must exist.
#
# This account's Distribution certs are Codemagic-managed → signing MUST use Form 2
# (`provisioning_profiles` + `certificates`), never Form 1 (`distribution_type` + `bundle_identifier`).
# 3 Distribution certs exist (Apple's cap — do NOT create another). Codemagic identity
# `distribution` = the cert expiring 2027-07-17. Create the provisioning profile against
# that cert.

definitions:
  triggering: &triggering
    events:
      - push
    branch_patterns:
      - pattern: main
        include: true
  scripts:
    npm_ci: &npm_ci
      name: Install npm dependencies
      script: npm ci
    cap_sync: &cap_sync
      name: Select Capacitor config + sync iOS
      script: |
        set -e
        cp "$CAP_CONFIG" capacitor.config.ts
        npx cap sync ios
    use_profiles: &use_profiles
      name: Set up code signing
      script: xcode-project use-profiles
    bump_build: &bump_build
      name: Increment build number from TestFlight
      script: |
        set -e
        cd "$CM_BUILD_DIR/$APP_DIR"
        LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
        agvtool new-version -all $((LATEST + 1))
    build_ipa: &build_ipa
      name: Build ipa
      script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "App"
  artifacts: &artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
  publishing: &publishing
    app_store_connect:
      auth: integration
      submit_to_testflight: true
      submit_to_app_store: false

workflows:

  vocab-ios:
    name: Vocab (merged) — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        provisioning_profiles:
          - vocab_merged_appstore
        certificates:
          - distribution
      node: 22
      xcode: latest
      vars:
        CAP_CONFIG: "capacitor.config.app.ts"
        APP_DIR: "ios/app/App"
        XCODE_PROJECT: "ios/app/App/App.xcodeproj"
        BUNDLE_ID: "com.simonjhuan.vocabdaily"
        APP_STORE_APPLE_ID: 6807688657
    triggering: *triggering
    scripts: [*npm_ci, *cap_sync, *use_profiles, *bump_build, *build_ipa]
    artifacts: *artifacts
    publishing: *publishing
